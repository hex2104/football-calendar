name: Keep schedule alive

# GitHub disables scheduled workflows in a public repo after 60 days with no
# repository activity. Force-enabling a workflow through the API resets that
# inactivity counter, so this runs weekly and re-enables both workflows -
# including itself, which is what stops this one from being disabled too.
#
# Weekly rather than monthly on purpose: it leaves plenty of margin if a run
# is skipped during a GitHub incident.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Reset the inactivity counter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in build.yml keepalive.yml; do
            gh api -X PUT \
              "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              --silent
            echo "re-enabled $wf"
          done
