name: Tests

# Python 3.9 is in the matrix on purpose: the Mac that runs the local trigger
# only has 3.9, and newer syntax passes on 3.12 while breaking there.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Offline build and validation
        run: |
          python build_ics.py --offline sample_payload.json --out "$RUNNER_TEMP/out"
          python validate_ics.py "$RUNNER_TEMP"/out/*.ics
