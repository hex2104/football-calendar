name: Build football calendar

on:
  schedule:
    # Every 10 minutes, deliberately offset off the :00 boundary. GitHub's own
    # docs say load peaks at the top of the hour and that queued scheduled jobs
    # may be dropped entirely when it is high, so */10 (which lands on :00)
    # is the worst possible phase. This is still best-effort: treat it as
    # "eligible every 10 minutes", never as a timer. The reliable trigger is
    # an external scheduler calling workflow_dispatch.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_ics.py"
      - "config.yaml"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight build finish rather than piling up during a matchday.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build the .ics feed
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build_ics.py --config config.yaml --out public

      - name: Sanity-check the output
        run: |
          test -s public/football.ics
          python validate_ics.py public/football.ics

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
